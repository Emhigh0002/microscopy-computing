        // --- VIEW 7: REPORT GENERATOR ---
        function ReportsView({ images, token }) {
            const [selectedIds, setSelectedIds] = useState([]);
            const [format, setFormat] = useState("PDF");
            const [loading, setLoading] = useState(false);
            const [reports, setReports] = useState([]);

            useEffect(() => {
                fetchReports();
            }, []);

            const fetchReports = async () => {
                try {
                    const res = await fetch(`${API_BASE}/reports/`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setReports(data);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleToggleSelect = (id) => {
                if (selectedIds.includes(id)) {
                    setSelectedIds(selectedIds.filter(x => x !== id));
                } else {
                    setSelectedIds([...selectedIds, id]);
                }
            };

            const handleGenerate = async (e) => {
                e.preventDefault();
                if (selectedIds.length === 0) return;
                
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/reports/generate`, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            image_ids: selectedIds,
                            format: format
                        })
                    });

                    if (res.ok) {
                        fetchReports();
                        setSelectedIds([]);
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                    {/* Select Form */}
                    <div class="md:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl h-fit space-y-6">
                        <h3 class="font-bold text-white text-base">Export Diagnostics</h3>
                        
                        <div class="space-y-3">
                            <label class="block text-xs font-semibold text-slate-400">Select Format</label>
                            <div class="grid grid-cols-3 gap-2">
                                {["PDF", "XLSX", "CSV"].map(f => (
                                    <button key={f} onClick={() => setFormat(f)} type="button" class={`py-2 rounded border text-xs font-semibold ${format === f ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>{f}</button>
                                ))}
                            </div>
                        </div>

                        <button 
                            onClick={handleGenerate}
                            disabled={selectedIds.length === 0 || loading}
                            class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg font-semibold text-xs text-white transition shadow-md"
                        >
                            {loading ? "Generating..." : `Compile Report (${selectedIds.length} Slides)`}
                        </button>
                    </div>

                    {/* Report Archive List & Selection */}
                    <div class="md:col-span-2 space-y-6">
                        {/* Slide Selector */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
                            <h3 class="font-bold text-white text-sm mb-4">Select Slides to Include</h3>
                            <div class="max-h-40 overflow-y-auto space-y-2 custom-scrollbar">
                                {images.map(img => (
                                    <label key={img.id} class="flex items-center gap-3 p-2 bg-slate-850 hover:bg-slate-800 rounded text-xs cursor-pointer select-none">
                                        <input type="checkbox" checked={selectedIds.includes(img.id)} onChange={()=>handleToggleSelect(img.id)} class="rounded bg-slate-800 border-slate-700 text-indigo-500 focus:ring-0" />
                                        <span class="text-white font-medium">{img.file_name}</span>
                                    </label>
                                ))}
                            </div>
                        </div>

                        {/* Archives */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
                            <h3 class="font-bold text-white text-sm mb-4">Report History Archive</h3>
                            <div class="divide-y divide-slate-800 max-h-60 overflow-y-auto custom-scrollbar">
                                {reports.map(rep => (
                                    <div key={rep.id} class="py-3 flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-semibold text-white">{rep.file_name}</p>
                                            <p class="text-[10px] text-slate-500">{new Date(rep.created_at).toLocaleString()}</p>
                                        </div>
                                        <a href={`${API_BASE}/reports/${rep.id}/download`} download class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-bold text-indigo-400 rounded">
                                            Download
                                        </a>
                                    </div>
                                ))}
                                {reports.length === 0 && (
                                    <div class="text-center text-slate-500 py-6">
                                        No clinical reports generated yet.
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- VIEW 8: LIVE MICROSCOPE CAMERA ---
        function CameraView({ token }) {
            const [cameras, setCameras] = React.useState([]);
            const [selectedCam, setSelectedCam] = React.useState(null);
            const [crosshair, setCrosshair] = React.useState(true);
            const [grid, setGrid] = React.useState(false);
            const [ruler, setRuler] = React.useState(false);
            const [brightness, setBrightness] = React.useState(100);
            const [contrast, setContrast] = React.useState(100);
            const [saturation, setSaturation] = React.useState(100);
            const [resolution, setResolution] = React.useState("1080p");
            const [isRecording, setIsRecording] = React.useState(false);
            const [recordingTime, setRecordingTime] = React.useState(0);
            const [captureLoading, setCaptureLoading] = React.useState(false);
            const [captureMessage, setCaptureMessage] = React.useState("");

            // Live Session Hooks
            const [activeSession, setActiveSession] = React.useState(null);
            const [liveFrame, setLiveFrame] = React.useState(null);
            const [detections, setDetections] = React.useState([]);
            const [stats, setStats] = React.useState({ achieved_fps: 0, total_detections: 0, class_counts: {}, avg_confidence: 0 });
            const [cameraSource, setCameraSource] = React.useState("0");
            const [sessionLoading, setSessionLoading] = React.useState(false);
            const [errorMessage, setErrorMessage] = React.useState("");
            const wsRef = React.useRef(null);

            const [exportingClip, setExportingClip] = React.useState(false);
            const [clipProgress, setClipProgress] = React.useState(0);
            const [clipDownloadUrl, setClipDownloadUrl] = React.useState(null);

            React.useEffect(() => {
                const getCams = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/camera/list`, {
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setCameras(data);
                            if (data.length > 0) {
                                setSelectedCam(data[0]);
                                setCameraSource(data[0].id.toString());
                            }
                        }
                    } catch (err) {
                        console.error(err);
                    }
                };
                getCams();
                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, [token]);

            const triggerCapture = async () => {
                const targetSrc = activeSession ? activeSession.camera_source : (selectedCam ? selectedCam.id : 0);
                setCaptureLoading(true);
                setCaptureMessage("");
                try {
                    const res = await fetch(`${API_BASE}/camera/capture/${targetSrc}`, {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setCaptureMessage("Snapshot captured and saved as Slide ID: " + data.image_id.slice(0,8));
                    }
                } catch (err) {
                    setCaptureMessage("Capture failed: " + err.message);
                } finally {
                    setCaptureLoading(false);
                }
            };

            const handleExportClip = async () => {
                setExportingClip(true);
                setClipProgress(0);
                setClipDownloadUrl(null);
                
                try {
                    const targetId = activeSession ? activeSession.id : null;
                    if (!targetId) {
                        setExportingClip(false);
                        return;
                    }
                    
                    const res = await fetch(`${API_BASE}/video/sessions/${targetId}/clip`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });

                    if (res.ok) {
                        const clipData = await res.json();
                        const clipId = clipData.id;

                        const pollInterval = setInterval(async () => {
                            try {
                                const statusRes = await fetch(`${API_BASE}/clips/status/${clipId}`, {
                                    headers: { "Authorization": `Bearer ${token}` }
                                });
                                if (statusRes.ok) {
                                    const statusData = await statusRes.json();
                                    setClipProgress(statusData.progress);

                                    if (statusData.status === "completed") {
                                        clearInterval(pollInterval);
                                        setExportingClip(false);
                                        setClipDownloadUrl(`${API_BASE}/clips/${clipId}/download`);
                                    } else if (statusData.status === "failed") {
                                        clearInterval(pollInterval);
                                        setExportingClip(false);
                                    }
                                }
                            } catch (err) {
                                console.error("Status polling error:", err);
                            }
                        }, 1000);
                    }
                } catch (err) {
                    console.error("Clip export error:", err);
                    setExportingClip(false);
                }
            };

            const startLiveSession = async () => {
                setSessionLoading(true);
                setErrorMessage("");
                try {
                    const res = await fetch(`${API_BASE}/video/sessions/start`, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ camera_source: cameraSource })
                    });
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.detail || "Failed to start session");
                    }
                    const sess = await res.json();
                    setActiveSession(sess);

                    // Connect WebSocket
                    const wsUrl = `${API_BASE.replace("http", "ws")}/video/sessions/${sess.id}/stream?token=${token}`;
                    const ws = new WebSocket(wsUrl);
                    wsRef.current = ws;

                    ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.error) {
                            setErrorMessage(data.error);
                            stopLiveSession(sess.id);
                        } else {
                            if (data.frame) setLiveFrame(data.frame);
                            if (data.detections) setDetections(data.detections);
                            if (data.stats) setStats(data.stats);
                        }
                    };

                    ws.onerror = (err) => {
                        console.error("WS Error:", err);
                        setErrorMessage("Microscope connection error.");
                    };

                    ws.onclose = () => {
                        console.log("WS connection closed");
                    };

                } catch (err) {
                    setErrorMessage(err.message);
                    setActiveSession(null);
                } finally {
                    setSessionLoading(false);
                }
            };

            const stopLiveSession = async (sessId = null) => {
                const targetId = sessId || (activeSession && activeSession.id);
                if (!targetId) return;

                if (wsRef.current) {
                    wsRef.current.close();
                    wsRef.current = null;
                }

                try {
                    const res = await fetch(`${API_BASE}/video/sessions/${targetId}/stop`, {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const summary = await res.json();
                        setStats(summary);
                    }
                } catch (err) {
                    console.error("Error stopping session:", err);
                }

                setActiveSession(null);
                setLiveFrame(null);
                setDetections([]);
            };

            return (
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 h-[calc(100vh-120px)]">
                    <div class="lg:col-span-3 flex flex-col bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm transition-colors duration-200">
                        <div class="px-6 py-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-between items-center text-xs">
                            <span class="text-slate-500 dark:text-slate-400 font-bold flex items-center gap-2">
                                <span class={`w-2.5 h-2.5 rounded-full ${activeSession ? 'bg-red-500 animate-pulse' : 'bg-slate-400'}`}></span>
                                Live Feed: {activeSession ? `Session Active (Source: ${activeSession.camera_source})` : (selectedCam ? selectedCam.name : "Offline")}
                            </span>
                            <span class="font-mono text-blue-600 dark:text-blue-400 font-bold">
                                {activeSession ? `${stats.achieved_fps || "0.0"} FPS | Real-time AI Overlays Active` : "Awaiting session..."}
                            </span>
                        </div>
                        
                        <div class="flex-1 relative overflow-hidden bg-black flex items-center justify-center min-h-[500px]">
                            {activeSession ? (
                                <>
                                    {liveFrame ? (
                                        <img 
                                            src={liveFrame}
                                            class="absolute max-h-[500px] max-w-full z-0 object-contain"
                                            style={{
                                                filter: `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`
                                            }}
                                        />
                                    ) : (
                                        <div class="text-slate-400 text-xs font-semibold animate-pulse flex flex-col items-center gap-3">
                                            <span class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></span>
                                            Initializing Real-time Microscope Feed...
                                        </div>
                                    )}
                                    <svg 
                                        viewBox="0 0 800 600" 
                                        class="absolute inset-0 pointer-events-none z-10 w-full h-full"
                                        style={{ display: liveFrame ? "block" : "none" }}
                                    >
                                        {detections.map((det, idx) => {
                                            const { x, y, w, h } = det.box;
                                            return (
                                                <g key={idx}>
                                                    <rect x={x} y={y} width={w} height={h} fill="none" stroke="#2563eb" strokeWidth="2" />
                                                    <rect x={x} y={y - 15 >= 0 ? y - 15 : 0} width={Math.max(90, w)} height="15" fill="#2563eb" />
                                                    <text x={x + 3} y={y - 15 >= 0 ? y - 4 : 11} fill="#ffffff" fontSize="9" fontWeight="bold" fontFamily="Outfit, sans-serif">
                                                        {det.class} (ID:{det.track_id})
                                                    </text>
                                                </g>
                                            );
                                        })}
                                    </svg>
                                </>
                            ) : selectedCam ? (
                                <img 
                                    src={`${API_BASE}/camera/stream/${selectedCam.id}`}
                                    class="absolute max-h-[500px] max-w-full z-0 object-contain"
                                    style={{
                                        filter: `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`
                                    }}
                                />
                            ) : (
                                <div class="text-slate-500 text-sm">Searching for connected digital microscope cameras...</div>
                            )}
                            
                            {crosshair && !activeSession && (
                                <div class="absolute inset-0 pointer-events-none z-10 flex items-center justify-center">
                                    <div class="w-10 h-0.5 bg-blue-500/50"></div>
                                    <div class="w-0.5 h-10 bg-blue-500/50 absolute"></div>
                                    <div class="w-12 h-12 rounded-full border border-blue-500/30 absolute"></div>
                                </div>
                            )}
                            
                            {grid && !activeSession && (
                                <div class="absolute inset-0 pointer-events-none z-10 grid grid-cols-4 grid-rows-4 border-collapse opacity-25">
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                    <div class="border border-slate-200 dark:border-slate-700"></div>
                                </div>
                            )}

                            {ruler && !activeSession && (
                                <div class="absolute bottom-6 left-6 bg-slate-900/85 border border-slate-700 px-3 py-1 rounded text-[10px] text-slate-300 font-mono flex items-center gap-2 z-10">
                                    <div class="w-16 h-1 bg-white border-t border-b border-black"></div>
                                    <span>5.00 µm Scale Bar</span>
                                </div>
                            )}
                        </div>
                        
                        <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-between items-center transition-colors duration-200">
                            <div class="flex flex-wrap items-center gap-3">
                                <button 
                                    onClick={triggerCapture}
                                    disabled={captureLoading || (!selectedCam && !activeSession)}
                                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-xs font-bold text-white rounded-xl flex items-center gap-2 shadow-sm transition"
                                >
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                                    Capture Snapshot
                                </button>
                                
                                {activeSession && (
                                    <button

                                        disabled={exportingClip}

                                    >
                                        {exportingClip ? (
                                            <>
                                                <span class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                                                <span>Background Exporting ({clipProgress}%)...</span>
                                            </>
                                        ) : (
                                            <>
                                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>

                            </div>

                                    {captureMessage}
                                </span>
                            )}
                        </div>
                    </div>

                    <div class="lg:col-span-1 space-y-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl overflow-y-auto custom-scrollbar shadow-sm transition-colors duration-200">
                        {/* Live AI Detection Session Controller */}
                        <div class="p-4 bg-blue-50/50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/50 rounded-2xl">

                                    <div class="grid grid-cols-2 gap-2 text-center text-xs">

                                <div class="space-y-3.5">
                                    <div>
                                        <label class="block text-[10px] text-slate-500 dark:text-slate-400 uppercase mb-1.5 font-bold">Camera Source / RTSP / Video file</label>
                                        <input 
                                            type="text" 
                                            class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold focus:outline-none"
                                            value={cameraSource}
                                            onChange={(e) => setCameraSource(e.target.value)}
                                            placeholder="e.g. 0 or rtsp://..."
                                        />
                                    </div>
                                    <button 
                                        onClick={startLiveSession}
                                        disabled={sessionLoading}
                                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-xs font-bold text-white rounded-xl shadow-sm transition"
                                    >
                                        {sessionLoading ? "Initializing..." : "Start AI Live Session"}
                                    </button>
                                </div>
                            )}

                            {errorMessage && (
                                <p class="mt-3 text-[10px] font-bold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/50 p-2 rounded-xl text-center">
                                    {errorMessage}
                                </p>
                            )}
                        </div>

                        <div>
                            <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-4">Device Manager</h3>
                            <label class="block text-[10px] text-slate-500 dark:text-slate-400 uppercase mb-2 font-bold">Select Active Microscope</label>
                            <select 
                                disabled={!!activeSession}
                                class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2.5 text-xs font-semibold focus:outline-none disabled:opacity-50"
                                value={selectedCam ? selectedCam.id : ""}
                                onChange={(e) => {
                                    const cam = cameras.find(c => c.id === parseInt(e.target.value));
                                    setSelectedCam(cam);
                                    if (cam) setCameraSource(cam.id.toString());
                                }}
                            >
                                {cameras.map(c => (
                                    <option key={c.id} value={c.id}>{c.name}</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-4">Live Overlays</h3>
                            <div class="space-y-3 text-xs">
                                <label class="flex items-center gap-2.5 text-slate-600 dark:text-slate-300 font-medium cursor-pointer">
                                    <input type="checkbox" checked={crosshair} onChange={(e) => setCrosshair(e.target.checked)} class="rounded bg-slate-100 dark:bg-slate-800 border-slate-350 dark:border-slate-700 text-blue-600" />
                                    Show Centroid Crosshair
                                </label>
                                <label class="flex items-center gap-2.5 text-slate-600 dark:text-slate-300 font-medium cursor-pointer">
                                    <input type="checkbox" checked={grid} onChange={(e) => setGrid(e.target.checked)} class="rounded bg-slate-100 dark:bg-slate-800 border-slate-350 dark:border-slate-700 text-blue-600" />
                                    Show Grid Overlay
                                </label>
                                <label class="flex items-center gap-2.5 text-slate-600 dark:text-slate-300 font-medium cursor-pointer">
                                    <input type="checkbox" checked={ruler} onChange={(e) => setRuler(e.target.checked)} class="rounded bg-slate-100 dark:bg-slate-800 border-slate-350 dark:border-slate-700 text-blue-600" />
                                    Show 5.0µm Scale Ruler
                                </label>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Image Adjustments</h3>
                            <div class="space-y-3">
                                <div>
                                    <div class="flex justify-between text-[10px] text-slate-400 font-bold mb-1">
                                        <span>Brightness</span>
                                        <span>{brightness}%</span>
                                    </div>
                                    <input type="range" min="50" max="150" value={brightness} onChange={(e) => setBrightness(parseInt(e.target.value))} class="w-full accent-blue-600" />
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] text-slate-400 font-bold mb-1">
                                        <span>Contrast</span>
                                        <span>{contrast}%</span>
                                    </div>
                                    <input type="range" min="50" max="150" value={contrast} onChange={(e) => setContrast(parseInt(e.target.value))} class="w-full accent-blue-600" />
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] text-slate-400 font-bold mb-1">
                                        <span>Saturation</span>
                                        <span>{saturation}%</span>
                                    </div>
                                    <input type="range" min="50" max="150" value={saturation} onChange={(e) => setSaturation(parseInt(e.target.value))} class="w-full accent-blue-600" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
