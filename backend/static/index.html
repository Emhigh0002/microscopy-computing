<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopy AI Platform - microorganism detection, count, & measurements</title>
    <!-- Outfit & JetBrains Mono Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    
    <!-- Custom styling overrides -->
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #090d16;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-indigo {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }
        .glow-emerald {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }
        .premium-bg-gradient {
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.05), transparent 50%),
                        #090d16;
        }
        .sidebar-btn-active {
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .card-glow-hover:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 15px rgba(99, 102, 241, 0.1);
        }
        .pulse-border {
            animation: pulse-border-anim 2s infinite alternate;
        }
        @keyframes pulse-border-anim {
            0% { border-color: rgba(99, 102, 241, 0.2); }
            100% { border-color: rgba(99, 102, 241, 0.6); }
        }
    </style>
</head>
<body class="h-full overflow-hidden font-sans antialiased custom-scrollbar bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="h-full"></div>

    <!-- MAIN REACT APPLICATION -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = "/api/v1";

        function App() {
            // Theme state
            const [theme, setTheme] = useState(() => {
                const local = localStorage.getItem('microscopy-theme');
                if (local) return local;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            });

            useEffect(() => {
                localStorage.setItem('microscopy-theme', theme);
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            // Navigation state
            const [activeTab, setActiveTab] = useState("dashboard");
            
            // Auth State
            const [authToken, setAuthToken] = useState(null);
            const [userRole, setUserRole] = useState("");
            const [userName, setUserName] = useState("");
            const [loginEmail, setLoginEmail] = useState("researcher@laboratory.org");
            const [loginPassword, setLoginPassword] = useState("password123");
            const [authError, setAuthError] = useState("");

            // Data State
            const [images, setImages] = useState([]);
            const [selectedImage, setSelectedImage] = useState(null);
            const [annotations, setAnnotations] = useState([]);
            const [activeModel, setActiveModel] = useState(null);
            const [trainingStatus, setTrainingStatus] = useState(null);

            // Auto log in on load
            useEffect(() => {
                handleLogin();
            }, []);

            const handleLogin = async (e) => {
                if (e) e.preventDefault();
                setAuthError("");
                try {
                    const formData = new FormData();
                    formData.append("username", loginEmail);
                    formData.append("password", loginPassword);

                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        body: formData
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || "Authentication failed");
                    }

                    const data = await res.json();
                    setAuthToken(data.access_token);
                    setUserRole(data.role);
                    setUserName(data.role === "Researcher" ? "Dr. Sarah Jenkins" : "Administrator");
                    
                    // Fetch initial data
                    fetchImages(data.access_token);
                    fetchActiveModels(data.access_token);
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            const fetchImages = async (token) => {
                try {
                    const res = await fetch(`${API_BASE}/images/`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setImages(data);
                    }
                } catch (err) {
                    console.error("Error fetching images:", err);
                }
            };

            const fetchActiveModels = async (token) => {
                try {
                    const res = await fetch(`${API_BASE}/training/active-models`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const active = data.find(m => m.status === "active") || data[0];
                        setActiveModel(active);
                    }
                } catch (err) {
                    console.error("Error fetching models:", err);
                }
            };

            if (!authToken) {
                // RENDER LOGIN SCREEN
                return (
                    <div class="flex min-h-full items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-[#090d16] relative overflow-hidden">
                        {/* Glow Blobs */}
                        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
                        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-violet-600/10 rounded-full blur-3xl"></div>
                        
                        <div class="w-full max-w-md space-y-8 p-8 bg-slate-950/50 backdrop-blur-xl border border-slate-850/80 rounded-2xl shadow-2xl relative z-10 glow-indigo">
                            <div>
                                <div class="flex justify-center text-indigo-500">
                                    <svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                                    </svg>
                                </div>
                                <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-white">Microscopy AI</h2>
                                <p class="mt-2 text-center text-sm text-slate-400">Sign in to your clinical research account</p>
                            </div>
                            <form class="mt-8 space-y-6" onSubmit={handleLogin}>
                                {authError && (
                                    <div class="p-3 bg-red-950 border border-red-800 rounded text-red-300 text-sm text-center">
                                        {authError}
                                    </div>
                                )}
                                <div class="rounded-md shadow-sm -space-y-px">
                                    <div>
                                        <label for="email-address" class="sr-only">Email address</label>
                                        <input id="email-address" name="email" type="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-slate-700 bg-slate-850 placeholder-slate-500 text-white rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Email address" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} />
                                    </div>
                                    <div>
                                        <label for="password" class="sr-only">Password</label>
                                        <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-slate-700 bg-slate-850 placeholder-slate-500 text-white rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} />
                                    </div>
                                </div>

                                <div>
                                    <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                                        Sign In
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div class="h-full flex overflow-hidden premium-bg-gradient">
                    {/* SIDEBAR */}
                    <aside class="w-64 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between transition-colors duration-200">
                        <div>
                            <div class="h-16 flex items-center px-6 gap-3 border-b border-slate-200 dark:border-slate-800">
                                <svg class="h-8 w-8 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                </svg>
                                <span class="font-bold text-lg text-slate-900 dark:text-white tracking-wide">Microscopy AI</span>
                            </div>
                            <nav class="mt-6 px-4 space-y-2">
                                <SidebarButton label="Dashboard" tab="dashboard" active={activeTab} onClick={setActiveTab} icon="grid" />
                                <SidebarButton label="Live Camera Feed" tab="camera" active={activeTab} onClick={setActiveTab} icon="camera" />
                                <SidebarButton label="Upload Image" tab="upload" active={activeTab} onClick={setActiveTab} icon="upload" />
                                <SidebarButton label="Annotation Tool" tab="annotation" active={activeTab} onClick={setActiveTab} icon="edit" />
                                <SidebarButton label="AI Assistant" tab="assistant" active={activeTab} onClick={setActiveTab} icon="message-square" />
                                <SidebarButton label="Dataset Management" tab="dataset" active={activeTab} onClick={setActiveTab} icon="database" />
                                <SidebarButton label="Model Training" tab="training" active={activeTab} onClick={setActiveTab} icon="cpu" />
                                <SidebarButton label="Export Reports" tab="reports" active={activeTab} onClick={setActiveTab} icon="file-text" />
                                <SidebarButton label="Session History" tab="history" active={activeTab} onClick={setActiveTab} icon="history" />
                            </nav>
                        </div>
                        <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center gap-3 transition-colors duration-200">
                            <div class="w-8 h-8 rounded-full bg-blue-50 border border-blue-200 dark:bg-slate-800 dark:border-slate-700 flex items-center justify-center font-bold text-xs text-blue-600 dark:text-blue-400">
                                {userName.split(' ').map(n=>n[0]).join('')}
                            </div>
                            <div class="min-w-0 flex-1">
                                <p class="text-xs font-bold text-slate-850 dark:text-white truncate">{userName}</p>
                                <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate">{userRole}</p>
                            </div>
                            <button onClick={() => setAuthToken(null)} class="text-slate-500 dark:text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition" title="Sign Out">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTAINER */}
                    <div class="flex-1 flex flex-col overflow-hidden">
                        {/* TOPBAR */}
                        <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 z-10 transition-colors duration-200">
                            <div>
                                <h1 class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">
                                    {activeTab.charAt(0).toUpperCase() + activeTab.slice(1).replace('-', ' ')}
                                </h1>
                            </div>
                            <div class="flex items-center gap-4">
                                {activeModel && (
                                    <div class="flex items-center gap-2 px-3 py-1 bg-slate-50 border border-slate-200 dark:bg-slate-800 dark:border-slate-700 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Active Model: <span class="text-blue-600 dark:text-blue-400 font-bold">{activeModel.name} [{activeModel.version}]</span>
                                    </div>
                                )}
                                <div class="text-xs text-slate-500 dark:text-slate-400 font-bold">
                                    Status: <span class="text-emerald-600 dark:text-emerald-400">Active Inference</span>
                                </div>
                                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition" title="Toggle Light/Dark Mode">
                                    {theme === 'dark' ? (
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                                    ) : (
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                                    )}
                                </button>
                            </div>
                        </header>

                        {/* VIEW PANEL */}
                        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            {activeTab === "dashboard" && <DashboardView images={images} token={authToken} onOpenAnnotation={(img) => { setSelectedImage(img); setActiveTab("annotation"); }} theme={theme} />}
                            {activeTab === "camera" && <CameraView token={authToken} />}
                            {activeTab === "upload" && <UploadView token={authToken} onUploadSuccess={() => { fetchImages(authToken); setActiveTab("dashboard"); }} />}
                            {activeTab === "annotation" && (
                                <AnnotationView 
                                    images={images} 
                                    selectedImage={selectedImage} 
                                    setSelectedImage={setSelectedImage}
                                    token={authToken}
                                />
                            )}
                            {activeTab === "assistant" && <AssistantView token={authToken} selectedImage={selectedImage} />}
                            {activeTab === "dataset" && <DatasetView />}
                            {activeTab === "training" && <TrainingView token={authToken} model={activeModel} refreshModels={() => fetchActiveModels(authToken)} />}
                            {activeTab === "reports" && <ReportsView images={images} token={authToken} />}
                            {activeTab === "history" && <SessionHistoryView token={authToken} onOpenAnnotation={(img) => { setSelectedImage(img); setActiveTab("annotation"); }} />}
                        </main>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENTS ---

        // SIDEBAR BUTTON
        function SidebarButton({ label, tab, active, onClick, icon }) {
            const isActive = active === tab;
            
            // Inline lucide svg render equivalents
            const getIcon = () => {
                if (icon === "grid") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;
                if (icon === "camera") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>;
                if (icon === "upload") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>;
                if (icon === "edit") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>;
                if (icon === "history") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-9-9 9 9 0 0 1 9 9Z"/></svg>;
                if (icon === "message-square") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
                if (icon === "database") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>;
                if (icon === "cpu") return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></svg>;
                return <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
            };

            return (
                <button onClick={() => onClick(tab)} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 ${isActive ? 'sidebar-btn-active text-white font-semibold' : 'text-slate-400 hover:text-slate-100 hover:bg-slate-900/60 hover:translate-x-1'}`}>
                    {getIcon()}
                    {label}
                </button>
            );
        }

        // --- VIEW: SESSION HISTORY ---
        function SessionHistoryView({ token, onOpenAnnotation }) {
            const [sessions, setSessions] = React.useState([]);
            const [selectedSession, setSelectedSession] = React.useState(null);
            const [frames, setFrames] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [detailsLoading, setDetailsLoading] = React.useState(false);
            const [exportingClip, setExportingClip] = React.useState(false);
            const [clipProgress, setClipProgress] = React.useState(0);
            const [clipUrl, setClipUrl] = React.useState(null);
            const [importMessage, setImportMessage] = React.useState("");

            const fetchSessions = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/video/sessions`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setSessions(data);
                    }
                } catch (err) {
                    console.error("Error fetching sessions:", err);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchSessions();
            }, [token]);

            const viewSessionDetails = async (session) => {
                setSelectedSession(session);
                setDetailsLoading(true);
                setFrames([]);
                setImportMessage("");
                setClipUrl(null);
                setExportingClip(false);
                try {
                    const res = await fetch(`${API_BASE}/video/sessions/${session.id}/frames`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setFrames(data);
                    }
                } catch (err) {
                    console.error("Error fetching frames:", err);
                } finally {
                    setDetailsLoading(false);
                }
            };

            const triggerSessionClip = async (sessionId) => {
                setExportingClip(true);
                setClipProgress(0);
                setClipUrl(null);

                const pollClip = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/video/sessions/${sessionId}/clip`, {
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setClipProgress(data.progress);
                            if (data.status === "completed") {
                                setClipUrl(`${API_BASE}/clips/${data.id}/download`);
                                setExportingClip(false);
                            } else if (data.status === "failed") {
                                setExportingClip(false);
                            } else {
                                setTimeout(pollClip, 1000);
                            }
                        }
                    } catch (err) {
                        console.error(err);
                        setExportingClip(false);
                    }
                };

                pollClip();
            };

            const importFrameToPipeline = async (frameId) => {
                setImportMessage("");
                try {
                    const res = await fetch(`${API_BASE}/video/sessions/frame/${frameId}/to-image`, {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setImportMessage("Successfully imported frame snapshot! Loading in Annotation view...");
                        
                        // Wait briefly then open
                        setTimeout(async () => {
                            // Fetch images so parent app refreshes list
                            const imgRes = await fetch(`${API_BASE}/images/${data.image_id}`, {
                                headers: { "Authorization": `Bearer ${token}` }
                            });
                            if (imgRes.ok) {
                                const imgData = await imgRes.json();
                                onOpenAnnotation(imgData);
                            }
                        }, 1200);
                    } else {
                        const err = await res.json();
                        setImportMessage("Import failed: " + (err.detail || "Database mismatch"));
                    }
                } catch (err) {
                    setImportMessage("Import failed: " + err.message);
                }
            };

            return (
                <div class="space-y-8">
                    {selectedSession ? (
                        <div class="space-y-6">

                            <div class="flex items-center justify-between">

                                    onClick={() => setSelectedSession(null)}

                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                    Back to Session List
                                </button>
                                <div class="flex gap-3">
                                    <a 
                                        href={`${API_BASE}/video/sessions/${selectedSession.id}/export?format=csv`}
                                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-xs font-bold text-white rounded-xl transition shadow-sm"
                                    >
                                        Export CSV Log
                                    </a>
                                    <a 
                                        href={`${API_BASE}/video/sessions/${selectedSession.id}/export?format=json`}
                                        class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-bold text-slate-750 dark:text-slate-200 rounded-xl transition"
                                    >
                                        Export JSON Log
                                    </a>
                                    <button 
                                        onClick={() => triggerSessionClip(selectedSession.id)}
                                        disabled={exportingClip}
                                        class="px-4 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-xs font-bold text-white rounded-xl transition shadow-sm"
                                    >
                                        {exportingClip ? `Generating HD Clip (${clipProgress}%)...` : "Compile HD Video Clip"}
                                    </button>
                                </div>
                            </div>

                            {clipUrl && (
                                <div class="p-4 bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/50 rounded-2xl flex justify-between items-center animate-pulse">
                                    <span class="text-xs font-bold text-emerald-800 dark:text-emerald-300">HD Video clip compiled successfully!</span>
                                    <a href={clipUrl} download class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white rounded-xl transition">
                                        Download Clip (.mp4)
                                    </a>
                                </div>
                            )}

                            {importMessage && (
                                <div class="p-4 bg-blue-50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/50 rounded-2xl text-xs font-bold text-blue-800 dark:text-blue-300">
                                    {importMessage}
                                </div>
                            )}

                            {/* Session Info Grid */}
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                                <div class="p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm">

                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Detections Logged</p>

                            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm">

                            <div class="space-y-4">

                                                    {frame.frame_path ? (
                                                        <img src={`data:image/jpeg;base64,...`} class="w-full h-full object-cover" />

                                        <svg class="w-4 h-4 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 1 1 21.2 8H17"/></svg>

                                <div class="divide-y divide-slate-200 dark:divide-slate-800">
                                    {sessions.map(sess => (

                                                <div class="flex items-center gap-3">

                                                    <p class="text-xs font-bold text-slate-700 dark:text-slate-300">Detections: {sess.total_detections}</p>
                                                    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Avg Conf: {(sess.avg_confidence * 100).toFixed(0)}% | FPS: {sess.achieved_inference_fps || "0"}</p>

                                                    onClick={() => viewSessionDetails(sess)}

                                            </div>

                                    {sessions.length === 0 && !loading && (
                                        <div class="px-6 py-12 text-center text-slate-500 dark:text-slate-400 text-sm italic">

                                        </div>

                                    {loading && (
                                        <div class="px-6 py-12 text-center text-slate-500 dark:text-slate-400 text-sm">
                                            Loading history...

                                    )}
